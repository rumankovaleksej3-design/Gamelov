<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Simulator</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <h1>🎁 CASE SIMULATOR</h1>

    <div class="balance">
        💰 Баланс:
        <span id="coins">1000</span>
    </div>
</header>

<main>

<div class="case-box">

<h2>Premium Case</h2>

<div class="roulette" id="roulette">

<div class="line"></div>

<div class="items" id="items">

<div class="card gray">Common</div>
<div class="card blue">Rare</div>
<div class="card purple">Epic</div>
<div class="card pink">Legendary</div>
<div class="card gold">Mythic</div>

</div>

</div>

<button id="openBtn">
Открыть кейс (100)
</button>

</div>

<section>

<h2>
Последний предмет
</h2>

<div id="winItem">

Ничего не выпало

</div>

</section>

<section>

<h2>

Инвентарь

</h2>

<div id="inventory">

</div>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
